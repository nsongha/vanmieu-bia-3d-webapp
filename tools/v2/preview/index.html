<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>v2 LOD preview</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #16171a; color: #ddd; font: 13px/1.35 system-ui, sans-serif; }
      #bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; background: #202226; position: sticky; top: 0; z-index: 2; }
      #bar label { display: inline-flex; gap: 6px; align-items: center; }
      #bar input[type=range] { width: 110px; }
      #bar select, #bar input[type=text] { background: #2b2d33; color: #eee; border: 1px solid #3a3d44; border-radius: 4px; padding: 2px 6px; }
      #wrap { position: relative; }
      canvas { display: block; }
      .lbl { position: absolute; padding: 3px 6px; background: rgba(0,0,0,.55); border-radius: 3px; font-size: 12px; pointer-events: none; white-space: pre; }
      #status { opacity: .7; }
    </style>
  </head>
  <body>
    <div id="bar">
      <label>bia <select id="id"></select></label>
      <label>xem <select id="view"></select></label>
      <label>key az <input id="az" type="range" min="-180" max="180" step="1" /><span id="azv"></span></label>
      <label>el <input id="el" type="range" min="2" max="80" step="1" /><span id="elv"></span></label>
      <label>I <input id="int" type="range" min="0" max="6" step="0.1" /><span id="intv"></span></label>
      <label>mô hình <input id="models" type="text" size="60" /></label>
      <span id="status"></span>
    </div>
    <div id="wrap"><canvas id="c"></canvas></div>
    <script type="module" src="./preview.js"></script>
  </body>
</html>
